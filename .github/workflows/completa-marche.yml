name: Completa le marche temporali

# Una marca OpenTimestamps diventa definitiva qualche ora dopo, quando la
# blockchain di Bitcoin l'ha registrata. Ogni lunedì (e a ogni
# pubblicazione) questo lavoro completa quelle rimaste in attesa.
# Nota: GitHub sospende i lavori programmati dopo 60 giorni senza
# modifiche al repository; ripartono da soli alla pubblicazione successiva.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  completa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --quiet opentimestamps-client
      - run: python scripts/marca.py --solo-completa
