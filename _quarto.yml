project:
  type: website
  output-dir: _site
  render:
    - "**/*.qmd"
    - "!_modelli/"       # modelli ed esempi: non vengono mai pubblicati
  resources:
    - CNAME
    - CITATION.cff
    - assets/fonts/

website:
  title: "Dietro al Monte"
  description: "Ricerche d'archivio su paesi e famiglie tra Vara, Aveto e Taro"
  site-url: https://dietroalmonte.it
  favicon: assets/favicon.svg
  # Le pagine con "draft: true" nella scheda non vengono pubblicate:
  # si vedono solo nell'anteprima sul tuo computer.
  draft-mode: gone
  search:
    location: navbar
    type: overlay
  navbar:
    title: "Dietro al Monte"
    left:
      - href: ricerche/index.qmd
        text: Ricerche
      - href: luoghi/index.qmd
        text: Luoghi
      - href: famiglie/index.qmd
        text: Famiglie
      - href: fonti/index.qmd
        text: Fonti
      - href: metodo.qmd
        text: Metodo
    right:
      - href: chi-sono.qmd
        text: Chi sono
      - icon: rss
        href: ricerche/index.xml
        aria-label: Feed RSS delle ricerche
  page-footer:
    border: false
    left: |
      Testi e immagini di Fabio Cassinelli, salvo diversa indicazione.
      Licenza [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.it).
    center: |
      [ORCID 0009-0009-4455-0112](https://orcid.org/0009-0009-4455-0112)
    right: |
      [Come citare e verificare](/metodo.qmd)

format:
  html:
    theme:
      - cosmo
      - assets/theme.scss
    css: assets/fonts.css
    # Niente formule matematiche: così nessuna pagina carica MathJax da fuori.
    html-math-method: plain
    include-in-header: assets/head.html
    toc: true
    toc-title: "In questa pagina"
    toc-depth: 3
    toc-location: left
    number-sections: false
    anchor-sections: true
    citations-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    link-external-icon: false
    fig-cap-location: bottom
    tbl-cap-location: top
    code-copy: false
    lang: it
    grid:
      sidebar-width: 260px
      body-width: 720px
      margin-width: 300px
      gutter-width: 1.6rem

# Due file di fonti: CSL-JSON per le unità archivistiche,
# BibTeX per la bibliografia a stampa. Entrambi esportati da Zotero.
bibliography:
  - fonti/fonti.json
  - fonti/bibliografia.bib
csl: assets/csl/dietroalmonte-archivistico.csl

lang: it
date-format: "D MMMM YYYY"

# I riquadri "DA COMPLETARE" si vedono solo in anteprima: vedi il file.
filters:
  - at: pre-ast
    path: scripts/da-completare.lua

execute:
  freeze: auto
  echo: false
  warning: false
